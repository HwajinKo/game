<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클래식 테트리스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tetris-container">
    <div class="main-panel">
      <div class="board-wrapper">
        <canvas id="tetris" width="240" height="480"></canvas>
        <div id="game-overlay" class="overlay hidden">
          <div id="overlay-msg">게임 종료</div>
          <button id="retry-btn">다시 시작</button>
        </div>
      </div>
    </div>

    <div class="side-panel">
      <h1>TETRIS</h1>

      <div class="card next-box">
        <h3>NEXT</h3>
        <canvas id="next" width="100" height="100"></canvas>
      </div>

      <div class="card stats">
        <div class="stat-item">
          <span class="label">점수</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="stat-item">
          <span class="label">레벨</span>
          <span id="level" class="value">1</span>
        </div>
        <div class="stat-item">
          <span class="label">완성 줄</span>
          <span id="lines" class="value">0</span>
        </div>
      </div>

      <div class="card controls-info">
        <h3>조작법</h3>
        <p><span>← / →</span> 이동</p>
        <p><span>↑</span> 회전</p>
        <p><span>↓</span> 소프트 드롭</p>
        <p><span>Space</span> 하드 드롭</p>
        <p><span>P</span> 일시정지</p>
      </div>

      <div class="btn-group">
        <button id="start-btn">시작 / 재시작</button>
        <button id="pause-btn">일시정지</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
